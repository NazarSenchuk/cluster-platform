apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
spec:
  project: default
  source:
    chart: cloudnative-pg
    repoURL: https://cloudnative-pg.io/charts/
    targetRevision: 0.28.3
    helm:
      releaseName: cnpg
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cnpg
  syncPolicy:
        syncOptions:
          - CreateNamespace=true

cluster:
  name: cluster-template
  instances: 1
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-secret
        password: app
  storage:
    size: 1Gi

backup:
  name: backup-example
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: pg-backup



apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-generator
  namespace: argocd
spec:
  project: default
  source:
    chart: kubernetes-secret-generator
    repoURL: https://helm.mittwald.de/
    targetRevision: 3.4.1
    helm:
      releaseName: cnpg
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cnpg
  syncPolicy:
    automated:
      prune: true      # Automatically deletes resources removed from Git
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

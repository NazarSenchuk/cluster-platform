db-chart:
  cluster:
    name: cluster-test
    instances: 1
    bootstrap:
      initdb:
        database: app
        owner: app
        secret:
          name: app-secret
          password: app
    storage:
      size: 1Gi
  
  backup:
    name: backup-test
    schedule: "0 0 0 * * *"
    backupOwnerReference: self
    cluster:
      name: pg-backup
  

